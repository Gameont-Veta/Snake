name: apk
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: akduy/buildozer-action@v2
        with:
          save_buildozer_cache: true
          buildozer_version: master
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SerpienteNeon
          path: bin/*.apk
