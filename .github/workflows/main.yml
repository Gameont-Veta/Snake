name: apk
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with Buildozer
        uses: akduy/buildozer-action@v2
        with:
          save_buildozer_cache: true
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeonSnake-APK
          path: bin/*.apk
