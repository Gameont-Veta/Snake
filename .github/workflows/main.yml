name: Build
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ArtemSerebriakov/buildozer-action@v1
        with:
          command: buildozer android debug
      - uses: actions/upload-artifact@v4
        with:
          name: MiJuego
          path: bin/*.apk
